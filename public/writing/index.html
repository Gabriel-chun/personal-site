<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing · Gabriel Chung · Trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="writing">
<main class="wrap" style="padding-bottom:80px">
  <div class="page-head"><p class="eyebrow">Idea Log · 札記</p><h1 class="serif">每篇札記，都源自一個正在追蹤的想法。</h1>
  <p>點上面的節點篩選，看哪些想法已經寫成文章、哪些還在觀察。</p></div>
  <div id="graph" style="margin-bottom:40px;max-width:760px"></div>
  <ul class="log" id="log"><li class="loading">讀取札記…</li></ul>
</main>
<script type="module">
import { load, logItem, fail } from '/assets/site.js';
import { mountIdeaGraph } from '/assets/idea-graph.js';
const l = document.getElementById('log'), g = document.getElementById('graph');
Promise.all([load('writing.json'), load('ideas.json')]).then(([ws, d]) => {
  l.innerHTML = ws.map(w => logItem(w, d.ideas)).join('');
  mountIdeaGraph(g, d);
}).catch(e => fail(l, e));
</script>
</body>
</html>
